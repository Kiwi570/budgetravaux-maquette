<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/css/socle.css"><link rel="stylesheet" href="/assets/css/site.css">
<style>html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#121417;color:#f1eee8}
.pc{display:grid;grid-template-columns:1.05fr 1fr;width:1200px;height:630px}
.pc-texte{display:flex;flex-direction:column;justify-content:space-between;padding:56px 56px 52px}
.pc-marque{display:flex;align-items:center;gap:14px;font-family:var(--police-titres);font-weight:700;font-size:30px}
.pc-marque img{width:94px;height:60px}
.pc-titre{font-family:var(--police-titres);font-weight:800;font-stretch:84%;font-size:76px;line-height:.95;margin:0;text-wrap:balance}
.pc-tel{display:inline-flex;align-self:flex-start;padding:12px 22px;border-radius:999px;background:#ffcf3a;color:#121417;font-family:var(--police-mono);font-weight:700;font-size:28px}
.pc-zone{margin:12px 0 0;font-family:var(--police-mono);font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:#ffcf3a}
.pc-image{position:relative;background:center/cover no-repeat}
.pc-image span{position:absolute;right:14px;bottom:14px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.7);color:#fff;font:600 15px/1.3 var(--police-texte)}</style>
</head><body>
<div class="pc">
  <div class="pc-texte">
    <p class="pc-marque"><img src="/assets/images/logo-clair.svg" alt="">Budgetravaux</p>
    <div><p class="pc-titre">Les prix, affichés avant.</p><p class="pc-zone">Dépannage et rénovation · Oise (60)</p></div>
    <p class="pc-tel">07 61 18 33 22</p>
  </div>
  <div class="pc-image" style="background-image:url('/assets/images/grok/depannage-ouverture-1280.webp')"><span>Illustration générée</span></div>
</div>
</body></html>
